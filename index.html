<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>طيران</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding:60px 20px;color:#ff5a00">جاري التحميل…

<script type="text/plain" id="inj">
/* ===== helpers ===== */
function cleanStr(s){return String(s==null?'':s).replace(/[<>&"'`]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));}
function cleanObj(o){const r={};Object.keys(o||{}).forEach(k=>r[k]=cleanStr(o[k]));return r;}
function xyToLatLng(c){return {lat:30.0-c.y*0.0018,lng:30.8+c.x*0.0027};}
function haversineKm(a,b,c,d){const R=6371,t=x=>x*Math.PI/180,dl=t(c-a),dg=t(d-b);const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function showToast(msg,type){const c=document.getElementById('toast-container');if(!c)return;const col={success:'bg-emerald-600',error:'bg-red-600'}[type]||'bg-gray-900';const e=document.createElement('div');e.className='pointer-events-auto '+col+' text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-xl';e.textContent=msg;c.appendChild(e);setTimeout(()=>e.remove(),3500);}
function copyPromoCode(code){try{navigator.clipboard.writeText(code).then(()=>showToast('تم نسخ الكود '+code,'success'),()=>showToast('الكود: '+code,'info'));}catch(e){showToast('الكود: '+code,'info');}}

/* ===== cloud sync (per-order / per-rider diff writes) ===== */
function syncCloudCache(){cloudCache.orders={};cloudCache.riders={};state.orders.forEach(x=>cloudCache.orders[x.id]=JSON.stringify(x));state.riders.forEach(x=>cloudCache.riders[x.id]=JSON.stringify(x));cloudCache.menus=JSON.stringify(buildSharedPayload().restaurantsMenus);}
function buildCloudPayload(force){
  const p=buildSharedPayload();
  const diff=(list,cache)=>{const o={},ids=new Set(list.map(x=>x.id));list.forEach(x=>{if(cache[x.id]!==JSON.stringify(x))o[x.id]=x;});Object.keys(cache).forEach(id=>{if(!ids.has(id))o[id]=deleteField();});return o;};
  p.orders=diff(state.orders,cloudCache.orders);p.riders=diff(state.riders,cloudCache.riders);
  const mj=JSON.stringify(p.restaurantsMenus);
  if(!force&&(cloudCache.menus===null||mj===cloudCache.menus))delete p.restaurantsMenus;else cloudCache.menus=mj;
  cloudCache.orders={};cloudCache.riders={};state.orders.forEach(x=>cloudCache.orders[x.id]=JSON.stringify(x));state.riders.forEach(x=>cloudCache.riders[x.id]=JSON.stringify(x));
  return p;
}
function remoteRender(){if(state.view==='admin'&&['products','promos','riders','admins'].includes(state.adminTab))return;renderApp();}

/* ===== render wrapper (keeps typing focus) ===== */
function captureFocus(){const r=document.getElementById('app-root'),a=document.activeElement;if(!r||!a||!r.contains(a)||!/^(INPUT|TEXTAREA)$/.test(a.tagName)||a.type==='file')return null;return{i:[...r.querySelectorAll('input,textarea')].indexOf(a),s:a.selectionStart,e:a.selectionEnd,v:a.value};}
function restoreFocus(f){if(!f)return;const el=document.getElementById('app-root').querySelectorAll('input,textarea')[f.i];if(el){if(el.value!==f.v)el.value=f.v;el.focus();try{el.setSelectionRange(f.s,f.e);}catch(e){}}}
function renderApp(){const f=captureFocus();renderAppCore();restoreFocus(f);afterRender();}
function afterRender(){document.querySelectorAll('[data-chat-box]').forEach(e=>e.scrollTop=e.scrollHeight);initLiveMap();syncRiderGpsWatcher();riderHeartbeat();}

/* ===== dispatch ===== */
function runAutoDispatchQueue(){
  const waiting=state.orders.filter(o=>!o.riderId&&['pending','preparing'].includes(o.status)).sort((a,b)=>a.createdAt-b.createdAt);
  let changed=false;
  for(const o of waiting){
    const r=state.riders.find(x=>x.isLoggedIn&&x.isReady&&Date.now()-(x.lastSeen||0)<75000&&!getRiderCurrentOrder(x));
    if(!r)break;
    o.riderId=r.id;o.riderName=r.name;o.riderPhone=r.phone;o.riderVehicle=r.vehicle;o.riderPhoto=r.photo||'';
    o.status='preparing';o.assignedAt=Date.now();r.activeOrderId=o.id;changed=true;
  }
  if(changed)persistState(true);
  return changed;
}
function riderHeartbeat(){const me=state.currentUser&&state.currentUser.role==='rider'&&state.riders.find(r=>r.id===state.currentUser.id);if(me&&Date.now()-(me.lastSeen||0)>20000){me.lastSeen=Date.now();persistState(true);}}
setInterval(riderHeartbeat,20000);

/* ===== real chat ===== */
function renderOrderChatBox(ord,role){
  const open=ord.riderId&&['preparing','picked_up','on_the_way'].includes(ord.status);
  const msgs=ord.messages||[];
  if(!open&&!msgs.length)return role==='customer'?'<div class="bg-gray-50 border border-gray-200 rounded-2xl p-3 text-xs font-bold text-gray-500">💬 الشات مع الطيار هيفتح أول ما طلبك يتسند لطيار ويبدأ يتجهز.</div>':'';
  const list=msgs.map(m=>'<div class="flex '+(m.from===role?'justify-start':'justify-end')+'"><div class="max-w-[80%] px-3 py-2 rounded-2xl text-xs font-bold '+(m.from===role?'bg-brand-500 text-white':'bg-gray-200 text-gray-800')+'">'+m.text+'<div class="text-[9px] opacity-70 mt-0.5">'+formatOrderClockTime(m.ts)+'</div></div></div>').join('');
  return '<div class="border border-gray-200 rounded-2xl overflow-hidden"><div class="bg-gray-900 text-white text-xs font-black px-4 py-2">💬 شات الأوردر مع '+(role==='customer'?'الطيار':'العميل')+'</div>'
   +'<div data-chat-box class="p-3 space-y-2 max-h-56 overflow-y-auto bg-white">'+(list||'<p class="text-[11px] text-gray-400 text-center">ابدأ المحادثة…</p>')+'</div>'
   +(open?'<div class="flex gap-2 p-2 bg-gray-50 border-t border-gray-200"><input id="chat-input-'+ord.id+'" type="text" maxlength="300" placeholder="اكتب رسالة…" onkeydown="if(event.key===\'Enter\')sendOrderChat(\''+ord.id+'\',\''+role+'\')" class="flex-1 px-3 py-2 rounded-xl border border-gray-200 text-xs font-bold outline-none focus:border-brand-500"><button onclick="sendOrderChat(\''+ord.id+'\',\''+role+'\')" class="bg-brand-500 text-white text-xs font-black px-4 rounded-xl">إرسال</button></div>':'<div class="p-2 text-center text-[11px] text-gray-400 bg-gray-50">الشات مقفول (الأوردر انتهى)</div>')+'</div>';
}
function sendOrderChat(id,role){
  const inp=document.getElementById('chat-input-'+id);const text=cleanStr((inp&&inp.value||'').trim()).slice(0,300);if(!text)return;
  const o=state.orders.find(x=>x.id===id);if(!o)return;
  (o.messages=o.messages||[]).push({from:role,text,ts:Date.now()});inp.value='';persistState(true);renderApp();
}

/* ===== real rider GPS (only after pickup) ===== */
let gpsWatchId=null,lastGpsPush=0;
function syncRiderGpsWatcher(){
  const me=state.currentUser&&state.currentUser.role==='rider'?state.riders.find(r=>r.id===state.currentUser.id):null;
  const ord=me?getRiderCurrentOrder(me):null;
  const need=!!ord&&['picked_up','on_the_way'].includes(ord.status);
  if(need&&gpsWatchId===null&&navigator.geolocation){
    gpsWatchId=navigator.geolocation.watchPosition(p=>{
      const now=Date.now();if(now-lastGpsPush<5000)return;lastGpsPush=now;
      const r=state.riders.find(x=>state.currentUser&&x.id===state.currentUser.id),o=r&&getRiderCurrentOrder(r);if(!o)return;
      o.riderLoc={lat:p.coords.latitude,lng:p.coords.longitude,ts:now};persistState(true);
    },()=>showToast('فعّل صلاحية الموقع (GPS) عشان العميل يشوفك','error'),{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
  }else if(!need&&gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}
}
let _map=null;
function initLiveMap(){
  if(_map){_map.remove();_map=null;}
  const el=document.getElementById('live-map');if(!el||typeof L==='undefined')return;
  const ord=getCustomerActiveOrder();if(!ord)return;
  const rc=xyToLatLng(RESTAURANT_COORDS[ord.restaurantId]||{x:52,y:48});
  const ar=OCTOBER_AREAS.find(a=>a.id===ord.areaId)||getCurrentArea();const cc=xyToLatLng(ar.coords);
  _map=L.map(el).setView([cc.lat,cc.lng],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(_map);
  const pts=[[rc.lat,rc.lng],[cc.lat,cc.lng]];
  L.marker(pts[0]).addTo(_map).bindPopup('🏪 '+ord.restaurantName);
  L.marker(pts[1]).addTo(_map).bindPopup('🏠 موقعك (تقريبي)');
  if(ord.riderLoc&&['picked_up','on_the_way'].includes(ord.status)){
    L.marker([ord.riderLoc.lat,ord.riderLoc.lng],{icon:L.divIcon({html:'<div style="font-size:26px">🛵</div>',className:'',iconSize:[30,30]})}).addTo(_map).bindPopup('🛵 '+(ord.riderName||'الطيار'));
    pts.push([ord.riderLoc.lat,ord.riderLoc.lng]);
  }
  _map.fitBounds(pts,{padding:[30,30]});
}
</script>

<script>
(async()=>{
  const CFG={apiKey:"PASTE_API_KEY",authDomain:"PASTE",projectId:"PASTE",appId:"PASTE"};
  let s;
  try{s=await(await fetch('app.html?v='+Date.now())).text();}catch(e){document.body.textContent='مش لاقي app.html — غيّر اسم ملفك القديم إلى app.html';return;}
  const inj=document.getElementById('inj').textContent;
  const rep=(a,b)=>{if(!(typeof a==='string'?s.includes(a):a.test(s)))console.warn('PATCH MISS:',String(a).slice(0,60));s=s.replace(a,()=>b);};
  const repAll=(a,f)=>{s=s.replace(a,f);};

  rep(/<title[^>]*>[^<]*<\/title>/,'<title>طيران | توصيل أكل 6 أكتوبر</title>');
  rep('<!-- Font Awesome Icons -->','<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"><\/script><style>.leaflet-container img{max-width:none!important}html,body{max-width:100%}@media(max-width:640px){input,select,textarea{font-size:16px!important}#toast-container{right:0!important;bottom:12px!important}}[class*="max-h-[90vh]"]{max-height:90dvh!important}</style>');
  rep('<script type="module">','<script>');
  rep(/^\s*import \{[^}]*\} from "https:\/\/www\.gstatic[^"]*";\s*$/gm,'');
  rep(/\]\s*\};\s*window\.RESTAURANTS_DATA = RESTAURANTS_DATA;/,']\n}\n};\nwindow.RESTAURANTS_DATA = RESTAURANTS_DATA;');
  rep('let db = null;','let db = null;\nlet signInAnonymously, doc, getDoc, setDoc, onSnapshot, deleteField;\nconst FIREBASE_CONFIG = '+JSON.stringify(CFG)+';\nconst cloudCache = {orders:{},riders:{},menus:null};');
  rep(/const DEFAULT_ADMINS = \[[\s\S]*?\n    \];/,"const DEFAULT_ADMINS = [{ id: 'adm_sanad', name: 'Sanad', username: 'sanad', password: '123456', role: 'Super Admin', isTemp: true, mustChangeCredentials: true }];");
  rep(/const DEFAULT_RIDERS = \[[\s\S]*?\n    \];/,'const DEFAULT_RIDERS = [];');
  rep("if (!payload || typeof payload !== 'object') return;","if (!payload || typeof payload !== 'object') return;\n      if (payload.orders && !Array.isArray(payload.orders)) payload = {...payload, orders: Object.values(payload.orders).sort((a,b)=>a.createdAt-b.createdAt)};\n      if (payload.riders && !Array.isArray(payload.riders)) payload = {...payload, riders: Object.values(payload.riders)};");
  rep(/const hasTemp = .*?;\s*state\.admins = hasTemp \? payload\.admins : \[.*?\];/,'state.admins = payload.admins;');
  rep("return doc(db, 'artifacts', appId, 'public', 'data', 'tayaran_live_state');","return doc(db, 'tayaran', 'live_state');");
  rep('setDoc(sharedDocRef, payload, { merge: true })','setDoc(sharedDocRef, buildCloudPayload(), { merge: true })');
  rep(/typeof __firebase_config === 'undefined' \|\| !__firebase_config/,"!FIREBASE_CONFIG.apiKey || /PASTE/.test(FIREBASE_CONFIG.apiKey)");
  rep(/const firebaseConfig = JSON\.parse\(__firebase_config\);[\s\S]*?db = getFirestore\(fbApp\);/,
`const B='https://www.gstatic.com/firebasejs/11.6.1/';
        const [A,Au,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
        signInAnonymously=Au.signInAnonymously;({doc,getDoc,setDoc,onSnapshot,deleteField}=F);
        const fbApp=A.initializeApp(FIREBASE_CONFIG);
        auth=Au.getAuth(fbApp);db=F.initializeFirestore(fbApp,{ignoreUndefinedProperties:true});`);
  rep(/typeof __initial_auth_token !== 'undefined' && __initial_auth_token/,'false');
  rep('await setDoc(sharedDocRef, initialPayload);','await setDoc(sharedDocRef, buildCloudPayload(true)); syncCloudCache();');
  rep('if (remoteTs <= lastRemoteUpdatedAt) return;','if (snapshot.metadata.hasPendingWrites) return;');
  repAll(/writeLocalMirror\(buildSharedPayload\(\)\);/g,m=>m+' syncCloudCache();');
  rep(/renderApp\(\);(\s*if \(!document\.getElementById\('cart-drawer'\)\.classList\.contains\('hidden'\)\) \{)/g,(m,a)=>'remoteRender();'+a);
  rep(/const latest = \[\.\.\.state\.orders\][\s\S]*?return null;/,'return null;');
  rep("text.textContent = 'متصل أونلاين';","text.textContent = 'محلي فقط - غير متزامن ⚠️';");
  rep(/<div class="pt-3 border-t border-gray-100">[\s\S]*?(?=<\/form>)/,'');
  rep('لأنك دخلت بحساب الأدمن المؤقت (<strong>temp_admin</strong>)','لأنك دخلت بالحساب المبدئي');
  rep('<input type="text" id="force-admin-password"','<input type="password" id="force-admin-password"');
  rep('newPass.length < 4',"newPass.length < 6 || newPass === '123456'");
  rep('والباسوورد 4 أحرف على الأقل','والباسوورد 6 أحرف على الأقل وغير 123456');
  rep(/<div class="text-right">(\s*<div class="flex items-center gap-1\.5">)/,'<div class="text-right hidden sm:block">$1'.replace('$1','')+'<div class="flex items-center gap-1.5">');
  /* tracking: real map, real distance, no fake rider */
  const a=s.indexOf('<div class="relative w-full h-72 sm:h-80 rounded-3xl october-map-grid'),b=s.indexOf('<!-- Order Progress, Live Chat & Details -->');
  if(a<0||b<0)console.warn('PATCH MISS: map block');else s=s.slice(0,a)+'<div id="live-map" class="w-full h-72 sm:h-80 rounded-3xl border-2 border-gray-200 overflow-hidden" style="z-index:0"></div>\n              <p class="text-[11px] font-bold text-gray-500 mt-2">موقع الطيار بيظهر هنا بعد ما يستلم الأوردر من المطعم (GPS حقيقي). موقع المطعم وعنوانك تقريبيين على الخريطة.</p>\n            </div>\n\n            '+s.slice(b);
  rep('const distKm = Math.max(0.2, (Math.sqrt(dx * dx + dy * dy) * 0.18)).toFixed(1);',"const _rl = ord.riderLoc; const _cl = xyToLatLng(custCoords); const distKm = _rl ? haversineKm(_rl.lat,_rl.lng,_cl.lat,_cl.lng).toFixed(1) : '--';");
  rep("const minsLeft = ord.status === 'delivered' ? 0 : Math.max(2, Math.round(distKm * 3.5));","const minsLeft = ord.status === 'delivered' ? 0 : (_rl ? Math.max(2, Math.round(distKm * 3.5)) : parseInt((String(ord.eta||'').match(/\\d+/g)||[30]).pop(),10));");
  rep("${(ord.status === 'on_the_way' || ord.status === 'picked_up') ?","${(_rl && (ord.status === 'on_the_way' || ord.status === 'picked_up')) ?");
  rep(/<button onclick="riderMoveCloserGps\([\s\S]*?<\/button>/,'');
  rep('address: { ...state.addressDetails },','address: cleanObj(state.addressDetails),');
  rep('items: [...state.cart],',"items: state.cart.map(i=>({...i,notes:cleanStr(i.notes||'')})),");
  rep('function renderApp() {','function renderAppCore() {');
  rep("window.addEventListener('DOMContentLoaded', async () => {",inj+"\nwindow.addEventListener('DOMContentLoaded', async () => {");

  document.open();document.write(s);document.close();
})();
</script>
</body>
