    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-gold: #aa7c11;
            --card-black: rgba(20, 20, 20, 0.94);
            --border-color: #333333;
            --text-light: #f3f3f3;
            --text-gray: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, rgba(10, 14, 26, 0.92), rgba(30, 10, 20, 0.92), rgba(15, 10, 5, 0.94)), 
                        url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1600') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        header, .container, .cart-modal, .admin-modal, #intro-splash, .custom-modal-overlay {
            position: relative;
            z-index: 10;
        }

        /* إضافة أنيميشن الضغط الحركي على كل الأزرار */
        button, .btn-gold, .btn-login, .btn-preview, .btn-add-cart, .btn-checkout, .btn-modal-confirm, .btn-modal-cancel {
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.3s ease, box-shadow 0.3s ease !important;
        }

        button:active, .btn-gold:active, .btn-login:active, .btn-preview:active, .btn-add-cart:active, .btn-checkout:active, .btn-modal-confirm:active, .btn-modal-cancel:active {
            transform: scale(0.93) !important;
        }

        /* شاشة الترحيب الافتتاحية */
        #intro-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 11, 20, 0.98);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            animation: fadeOutSplash 0.7s cubic-bezier(0.25, 1, 0.5, 1) 2.4s forwards;
        }

        .splash-content {
            text-align: center;
            z-index: 20;
        }

        .splash-content h1 {
            color: var(--primary-gold);
            font-size: 44px;
            font-weight: 900;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
        }

        .splash-content h1 span {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px) scale(0.85);
            animation: wordFadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .splash-content h1 span:nth-child(1) { animation-delay: 0.3s; }
        .splash-content h1 span:nth-child(2) { animation-delay: 0.45s; }
        .splash-content h1 span:nth-child(3) { animation-delay: 0.6s; }
        .splash-content h1 span:nth-child(4) { animation-delay: 0.75s; }
        .splash-content h1 span:nth-child(5) { animation-delay: 0.9s; }

        @keyframes wordFadeIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .splash-content p {
            color: var(--text-gray);
            font-size: 16px;
            opacity: 0;
            animation: fadeInDesc 0.6s ease 1.3s forwards;
        }

        @keyframes fadeInDesc {
            to { opacity: 1; }
        }

        @keyframes fadeOutSplash {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; pointer-events: none; }
        }

        /* الهيدر الواسع */
        header {
            background: rgba(10, 14, 26, 0.95);
            border-bottom: 2px solid var(--primary-gold);
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            backdrop-filter: blur(12px);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: var(--primary-gold);
            letter-spacing: 1px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .nav-btns {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: nowrap;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            white-space: nowrap;
        }

        .btn-gold:hover {
            opacity: 0.92;
            transform: translateY(-2px) scale(1.03);
        }

        .btn-login {
            background: #fff;
            color: #222;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            white-space: nowrap;
        }
        .btn-login:hover { background: #f1f1f1; transform: translateY(-2px) scale(1.03); }

        /* المحتوى الرئيسي */
        .container {
            max-width: 1450px;
            margin: 120px auto 40px;
            padding: 0 30px;
        }

        .hero-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 22, 34, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 30px 40px;
            margin-bottom: 35px;
            backdrop-filter: blur(10px);
        }

        .hero-text h1 {
            color: var(--primary-gold);
            font-size: 34px;
            margin-bottom: 8px;
            font-weight: 900;
        }

        .hero-text p {
            color: var(--text-gray);
            font-size: 15px;
        }

        /* شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 25px;
        }

        @keyframes smoothFallIn {
            0% { transform: translateY(-60px) scale(0.92); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes smoothFloatHover {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-6px) scale(1.025) rotate(0.4deg); }
        }

        .product-card {
            background: var(--card-black);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(10px);
            will-change: transform, opacity;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.4s ease;
            animation: smoothFallIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .product-card:nth-child(1) { animation-delay: 0.08s; }
        .product-card:nth-child(2) { animation-delay: 0.16s; }
        .product-card:nth-child(3) { animation-delay: 0.24s; }
        .product-card:nth-child(4) { animation-delay: 0.32s; }
        .product-card:nth-child(5) { animation-delay: 0.40s; }
        .product-card:nth-child(6) { animation-delay: 0.48s; }

        .product-card:hover {
            border-color: var(--primary-gold);
            box-shadow: 0 18px 35px rgba(212, 175, 55, 0.22);
            animation: smoothFloatHover 2.2s ease-in-out infinite;
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
            transition: filter 0.4s ease;
            cursor: pointer;
        }

        .product-card:hover .product-img {
            filter: brightness(1.12);
        }

        .product-info {
            padding: 18px;
        }

        .product-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-price-box {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .product-price {
            color: var(--primary-gold);
            font-size: 19px;
            font-weight: 900;
        }

        .product-old-price {
            text-decoration: line-through;
            color: #888;
            font-size: 13px;
        }

        .offer-badge {
            background: #ff4d4d;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .product-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-preview {
            background: #222;
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 9px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
        }
        .btn-preview:hover {
            border-color: var(--primary-gold);
            color: var(--primary-gold);
        }

        .btn-add-cart {
            background: transparent;
            border: 2px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 9px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
        }
        .btn-add-cart:hover {
            background: var(--primary-gold);
            color: #000;
        }

        /* سلة المشتريات */
        .cart-modal {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            height: 100%;
            background: rgba(15, 15, 15, 0.98);
            border-left: 2px solid var(--primary-gold);
            z-index: 2000;
            box-shadow: -5px 0 25px rgba(0,0,0,0.8);
            transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            padding: 20px;
            backdrop-filter: blur(15px);
        }

        .cart-modal.active { right: 0; }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 24px;
            cursor: pointer;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 30, 30, 0.6);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .checkout-form input, 
        .checkout-form select, 
        .checkout-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #222;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }

        .checkout-form select { cursor: pointer; }

        .btn-checkout {
            width: 100%;
            background: #25d366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 16px;
        }
        .btn-checkout:hover { opacity: 0.9; }

        /* صفحة نجاح الأوردر */
        .order-success-section {
            display: none;
            max-width: 800px;
            margin: 40px auto;
            background: var(--card-black);
            border: 2px solid #25d366;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .order-success-section h2 {
            color: #25d366;
            font-size: 28px;
            margin-bottom: 10px;
        }
