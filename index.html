<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الوصول الرئيسية | نظام آمن</title>
    <!-- أيقونة التبويب -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23050505' rx='20'/><circle cx='50' cy='50' r='20' fill='%23333'/></svg>">
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #050508;
            --card-bg: rgba(15, 15, 20, 0.85);
            --text-main: #e0e0e0;
            --text-muted: #888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* خلفية غامضة وهادئة */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(40,40,50,0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        /* شاشة الغلاف (البداية) */
        .gateway-container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            max-width: 450px;
            width: 90%;
            transition: opacity 0.5s ease;
        }

        .gateway-icon {
            font-size: 50px;
            color: #555;
            margin-bottom: 20px;
        }

        .gateway-title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .gateway-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .btn-enter {
            background: #15151a;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
        }

        .btn-enter:hover {
            background: #22222b;
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* شاشة عرض الفيديو بملء الشاشة */
        .video-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .video-screen.active {
            display: flex;
            opacity: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* عرض الفيديو بجودته الأصلية وبدون قص */
            outline: none;
        }

        .exit-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            pointer-events: none;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- واجهة الدخول الغامضة العادية -->
    <div class="gateway-container" id="gatewayBox">
        <div class="gateway-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="gateway-title">بوابة الوصول الآمنة</div>
        <div class="gateway-desc">يرجى التحقق والمتابعة للوصول إلى محتوى النظام المخصص.</div>
        <button class="btn-enter" onclick="enterSite()">بدء الدخول إلى الموقع</button>
    </div>

    <!-- شاشة عرض الفيديو بملء الشاشة بجودة عالية -->
    <div class="video-screen" id="videoScreen">
        <video id="mainVideo" controls playsinline preload="auto">
            <source src="https://archive.org/download/whats-app-video-2026-10-07-at-1.26.47-am/WhatsApp%20Video%202026-10-07-at-1.26.47-AM.mp4" type="video/mp4">
            متصفحك لا يدعم عرض الفيديو.
        </video>
        <div class="exit-hint">عرض بملء الشاشة بجودة عالية</div>
    </div>

    <script>
        function enterSite() {
            const gatewayBox = document.getElementById('gatewayBox');
            const videoScreen = document.getElementById('videoScreen');
            const videoElem = document.getElementById('mainVideo');

            // إخفاء واجهة الدخول
            gatewayBox.style.opacity = '0';
            setTimeout(() => {
                gatewayBox.style.display = 'none';
                
                // إظهار شاشة الفيديو وتشغيله بملء الشاشة
                videoScreen.classList.add('active');
                
                if (videoScreen.requestFullscreen) {
                    videoScreen.requestFullscreen().catch(err => console.log(err));
                } else if (videoScreen.webkitRequestFullscreen) {
                    videoScreen.webkitRequestFullscreen();
                } else if (videoScreen.msRequestFullscreen) {
                    videoScreen.msRequestFullscreen();
                }

                videoElem.play().catch(e => {
                    console.log("Auto-play restricted, controls are available.");
                });
            }, 500);
        }
    </script>
</body>
</html>
